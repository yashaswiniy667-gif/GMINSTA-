<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reels | GMinsta</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #000;
            margin: 0;
            overflow: hidden;
        }
        .reels-container {
            height: 100vh;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scrollbar-width: none;
        }
        .reels-container::-webkit-scrollbar { display: none; }
        
        .reel-item {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        .reel-video {
            height: 100%;
            width: 100%;
            object-fit: cover;
        }
        .reel-overlay {
            position: absolute;
            bottom: 80px;
            left: 15px;
            right: 60px;
            color: white;
            z-index: 10;
            pointer-events: none;
        }
        .reel-user {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            pointer-events: auto;
        }
        .reel-user img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid white;
        }
        .reel-actions {
            position: absolute;
            right: 15px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            color: white;
            z-index: 10;
        }
        .reel-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .reel-action i { font-size: 1.8rem; text-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .reel-action span { font-size: 0.8rem; }
        
        .nav-fixed {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            border-top: none;
            z-index: 100;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 1.5rem;
            z-index: 100;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <i class="fa-solid fa-arrow-left back-btn" onclick="window.location.href='feed.html'"></i>
    
    <div class="reels-container" id="reelsContainer">
        <!-- Reels will load here -->
    </div>

    <nav class="navbar nav-fixed">
        <div class="nav-links" style="justify-content: space-around; width: 100%;">
            <a href="feed.html"><i class="fa-solid fa-house" style="color: white;"></i></a>
            <a href="explore.html"><i class="fa-solid fa-magnifying-glass" style="color: white;"></i></a>
            <a href="reels.html"><i class="fa-solid fa-clapperboard" style="color: white;"></i></a>
            <a href="chat.html"><i class="fa-solid fa-paper-plane" style="color: white;"></i></a>
            <a href="profile.html"><i class="fa-regular fa-user" style="color: white;"></i></a>
        </div>
    </nav>

    <script src="js/script.js"></script>
    <script>
        async function loadReels() {
            // We'll fetch reels from the backend. 
            // The backend /api/reels route already returns all posts.
            // We will filter for vertical videos or just use the local ones.
            const reels = await apiRequest('/reels', 'GET');
            const container = document.getElementById('reelsContainer');
            container.innerHTML = '';
            
            reels.forEach((reel, index) => {
                // If the URL ends with .mp4, use video tag
                const isVideo = reel.image.endsWith('.mp4');
                
                container.innerHTML += `
                    <div class="reel-item">
                        ${isVideo ? 
                            `<video src="${reel.image}" class="reel-video" loop muted playsinline></video>` : 
                            `<img src="${reel.image}" class="reel-video">`
                        }
                        <div class="reel-overlay">
                            <div class="reel-user">
                                <img src="${reel.user.profilePic}">
                                <strong>${reel.user.username}</strong>
                            </div>
                            <p>${reel.caption}</p>
                        </div>
                        <div class="reel-actions">
                            <div class="reel-action">
                                <i class="fa-solid fa-heart"></i>
                                <span>${reel.likes.length}</span>
                            </div>
                            <div class="reel-action">
                                <i class="fa-solid fa-comment"></i>
                                <span>${reel.comments.length}</span>
                            </div>
                            <div class="reel-action">
                                <i class="fa-solid fa-paper-plane"></i>
                            </div>
                        </div>
                    </div>
                `;
            });

            initObserver();
        }

        function initObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (video) {
                        if (entry.isIntersecting) {
                            video.play();
                        } else {
                            video.pause();
                        }
                    }
                });
            }, { threshold: 0.8 });

            document.querySelectorAll('.reel-item').forEach(item => observer.observe(item));
        }

        loadReels();
    </script>
</body>
</html>
