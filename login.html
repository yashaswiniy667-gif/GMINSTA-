<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – GMinsta</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .login-container {
        max-width: 400px;
        margin: 100px auto;
        padding: 40px;
        background: var(--dark-card);
        border: 1px solid var(--dark-border);
        border-radius: var(--radius);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .login-logo {
        text-align: center;
        font-family: 'Dancing Script', cursive;
        font-size: 40px;
        background: var(--gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="app-container" style="justify-content: center; align-items: center; display: flex;">
    <div class="login-container" style="margin: 0; width: 100%; max-width: 380px;">
      <div class="login-logo">GMinsta</div>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn-gradient" style="width:100%; margin-top:20px;">
          Log In
        </button>
      </form>
      <div class="auth-switch" style="text-align:center; margin-top:20px;">
        Don't have an account? <a href="register.html">Sign Up</a>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const res = await loginUser(email, password);
        if (res.token) {
            window.location.href = 'feed.html';
        } else {
            alert(res.message || 'Login failed');
        }
    });
  </script>
</body>
</html>
